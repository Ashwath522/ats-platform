name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        # libmagic1 is required at runtime by python-magic (real file-content
        # validation) - without it, resume uploads would fail in CI even
        # though the code is correct.
        run: sudo apt-get update && sudo apt-get install -y libmagic1

      - name: Install Python dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        # Some tests (test_ownership.py) exercise endpoints that load the real
        # sentence-transformers embedding model, which downloads from
        # Hugging Face on first use. GitHub-hosted runners have normal
        # internet access, so this works here even though it can't be
        # verified in network-restricted sandboxes.
        run: pytest tests/ -v

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Build
        working-directory: frontend
        run: npm run build
