server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Single-page app: any non-file route falls back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Mirrors the Vite dev-server proxy ("/api" -> backend), but for production.
    # "backend" is the docker-compose service name, resolved via Docker's internal DNS.
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10M;  # a bit above MAX_UPLOAD_BYTES in candidate.py so nginx isn't the bottleneck
    }
}
