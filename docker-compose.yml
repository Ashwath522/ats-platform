services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ats_data:/app/data
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY in your .env before running}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:8080}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - EMAIL_PROVIDER=${EMAIL_PROVIDER:-}
      - BREVO_API_KEY=${BREVO_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-}
      - DEV_MODE=${DEV_MODE:-false}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - ATS_DATA_DIR=/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ats_data:
    # Persists sqlite DB, chroma vector store, and uploaded resumes across
    # container restarts/rebuilds. Without this, all data is lost on `docker
    # compose down` because it lives inside the backend container's /app/data.
