version: '3.8'

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET_KEY=integrated_hiring_platform_secret_key_2026
      - CORS_ORIGINS=http://localhost:5173,http://localhost:8080
    volumes:
      - ats_data:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  ats_data:
